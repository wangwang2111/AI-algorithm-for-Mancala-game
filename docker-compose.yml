version: "4.0"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      # If you enable optional Torch install in api.Dockerfile:
      # args:
      #   INSTALL_TORCH: "1"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_REGISTRY=/app/model_registry/latest
    ports:
      - "8000:8000"
    volumes:
      # Swap model weights without rebuilding
      - ./model_registry:/app/model_registry:ro
      # (Optional) live-mount src for quick iteration; comment out for prod
      # - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    # For Docker Desktop (non-Swarm) you can use device_requests instead:
    # device_requests:
    #   - driver: nvidia
    #     capabilities: [gpu]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
      args:
        API_BASE: http://api:8000/api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Optional: React dev server with hot reload (vite) ---
  # Run with: docker compose --profile dev up --build
  ui-dev:
    profiles: ["dev"]
    build:
      context: ./web
      dockerfile: Dockerfile # (optional) or just use node image below
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # Vite proxy: make sure vite.config.* proxies /api → http://api:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"


